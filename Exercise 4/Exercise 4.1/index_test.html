<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 4.1 - SVG House</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: #333;
        }

        p {
            color: #666;
        }

        svg {
            display: block;
            margin: 30px auto;
            border: 2px solid #333;
            background-color: #87ceeb;
        }
    </style>
</head>

<body>

    <h1>My SVG House and Garden</h1>

    <p>
        This picture was created using different SVG shapes.
    </p>

    <svg width="900"
         height="600"
         viewBox="0 0 900 600">

        <!-- SKY -->
        <rect
            x="0"
            y="0"
            width="900"
            height="600"
            fill="#87ceeb"
        />

        <!-- SUN -->
        <circle
            cx="760"
            cy="100"
            r="55"
            fill="#ffd93d"
        />

        <!-- CLOUD -->
        <ellipse
            cx="130"
            cy="105"
            rx="55"
            ry="25"
            fill="white"
        />

        <ellipse
            cx="175"
            cy="100"
            rx="50"
            ry="30"
            fill="white"
        />

        <ellipse
            cx="150"
            cy="80"
            rx="40"
            ry="30"
            fill="white"
        />

        <!-- GRASS -->
        <rect
            x="0"
            y="360"
            width="900"
            height="240"
            fill="#48a63f"
        />

        <!-- HOUSE BODY -->
        <rect
            x="300"
            y="250"
            width="320"
            height="260"
            fill="#d47b39"
            stroke="#7a431f"
            stroke-width="4"
        />

        <!-- ROOF -->
        <polygon
            points="260,250 460,90 660,250"
            fill="#9b4f24"
            stroke="#713515"
            stroke-width="4"
        />

        <!-- CHIMNEY -->
        <rect
            x="540"
            y="120"
            width="55"
            height="100"
            fill="#814626"
        />

        <!-- DOOR -->
        <rect
            x="425"
            y="380"
            width="75"
            height="130"
            fill="#6f3d26"
            stroke="#4f2c1c"
            stroke-width="3"
        />

        <!-- DOOR KNOB -->
        <circle
            cx="485"
            cy="450"
            r="6"
            fill="#f2c94c"
        />

        <!-- LEFT WINDOW -->
        <rect
            x="340"
            y="310"
            width="70"
            height="70"
            fill="#bfe9ff"
            stroke="#4b3728"
            stroke-width="4"
        />

        <!-- LEFT WINDOW DIVIDERS -->
        <line
            x1="375"
            y1="310"
            x2="375"
            y2="380"
            stroke="#4b3728"
            stroke-width="3"
        />

        <line
            x1="340"
            y1="345"
            x2="410"
            y2="345"
            stroke="#4b3728"
            stroke-width="3"
        />

        <!-- RIGHT WINDOW -->
        <rect
            x="515"
            y="310"
            width="70"
            height="70"
            fill="#bfe9ff"
            stroke="#4b3728"
            stroke-width="4"
        />

        <!-- RIGHT WINDOW DIVIDERS -->
        <line
            x1="550"
            y1="310"
            x2="550"
            y2="380"
            stroke="#4b3728"
            stroke-width="3"
        />

        <line
            x1="515"
            y1="345"
            x2="585"
            y2="345"
            stroke="#4b3728"
            stroke-width="3"
        />

        <!-- WALKWAY -->
        <path
            d="M 460 510
               C 430 530,
                 350 540,
                 360 600
               L 520 600
               C 530 560,
                 500 530,
                 460 510"
            fill="#d6b47b"
            stroke="#b48b54"
            stroke-width="4"
        />

        <!-- TREE TRUNK -->
        <rect
            x="120"
            y="315"
            width="35"
            height="150"
            fill="#8b542d"
        />

        <!-- TREE LEAVES -->
        <ellipse
            cx="105"
            cy="295"
            rx="55"
            ry="50"
            fill="#2f8f3a"
        />

        <ellipse
            cx="150"
            cy="285"
            rx="55"
            ry="55"
            fill="#287d35"
        />

        <ellipse
            cx="125"
            cy="250"
            rx="60"
            ry="50"
            fill="#319b41"
        />

        <!-- FLOWERS -->
        <circle cx="720" cy="470" r="10" fill="#ff4b91" />
        <circle cx="750" cy="490" r="10" fill="#f7d154" />
        <circle cx="785" cy="465" r="10" fill="#9b51e0" />

        <!-- FLOWER STEMS -->
        <line
            x1="720"
            y1="480"
            x2="720"
            y2="515"
            stroke="#1f7a36"
            stroke-width="4"
        />

        <line
            x1="750"
            y1="500"
            x2="750"
            y2="530"
            stroke="#1f7a36"
            stroke-width="4"
        />

        <line
            x1="785"
            y1="475"
            x2="785"
            y2="515"
            stroke="#1f7a36"
            stroke-width="4"
        />

        <!-- FENCE -->
        <polyline
            points="
                30,470
                30,400
                60,400
                60,470
                90,470
                90,400
                120,400
            "
            fill="none"
            stroke="#ffffff"
            stroke-width="8"
        />

        <!-- TEXT -->
        <text
            x="450"
            y="570"
            text-anchor="middle"
            font-size="28"
            font-weight="bold"
            fill="#ffffff"
        >
            Home Sweet Home
        </text>

    </svg>

</body>
</html>
